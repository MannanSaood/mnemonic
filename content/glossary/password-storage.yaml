# Terms introduced by the password storage lesson.
- id: salt
  term: Salt
  short: A random value, unique per stored password and kept next to the hash. Equal passwords get different hashes, so each user is a separate cracking job and precomputed tables stop working.
- id: password-hash
  term: Password hash
  short: A hash built to be slow on purpose (bcrypt, scrypt, Argon2id, PBKDF2), with a cost setting, so each guess costs an attacker as much as one login costs you.
- id: work-factor
  term: Work factor
  short: The cost setting of a password hash, such as bcrypt's cost or Argon2id's memory and passes. Stored with the hash so you can raise it later.
- id: memory-hard
  term: Memory-hard function
  short: A function that needs a lot of memory for every evaluation, so a GPU with thousands of cores but limited memory bandwidth cannot run thousands of guesses side by side cheaply.
- id: lookup-table
  term: Precomputed lookup table
  short: A table of hashes of likely passwords, computed once and reused against every unsalted leak that used the same hash. Rainbow tables are a space-saving variant.
- id: pepper
  term: Pepper
  short: A secret added to every password before hashing and kept outside the database, for example in a secrets manager, so a database-only leak cannot be cracked at all.
- id: credential-stuffing
  term: Credential stuffing
  short: Trying email and password pairs leaked from one site against the login of another, which works because people reuse passwords.
- id: constant-time-comparison
  term: Constant-time comparison
  short: Comparing two secrets in a way that takes the same time wherever they first differ, so response times leak nothing about how close a guess was.
